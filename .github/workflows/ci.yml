name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5433/template
  PAYLOAD_SECRET: ci-only-secret
  NEXT_PUBLIC_SERVER_URL: http://localhost:3001

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: template
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run integration tests
        run: pnpm test:int

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        env:
          E2E_QUARANTINE: 'page-shell.e2e.spec.ts,seo.e2e.spec.ts,pages-cms.e2e.spec.ts,live-preview.e2e.spec.ts,fixtures-visual.e2e.spec.ts'
        run: pnpm test:e2e
